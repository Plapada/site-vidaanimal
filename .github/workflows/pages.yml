# Publica a pasta inteira do repositorio no GitHub Pages a cada push na main.
#
# O site e um HTML estatico com CSS e JS embutidos - nao ha etapa de build,
# entao o job so empacota os arquivos como estao e envia.
#
# Para isto funcionar e preciso UMA configuracao manual, uma unica vez:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
