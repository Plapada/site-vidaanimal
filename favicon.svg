<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
<!--
  A MARCA DO VIDA ANIMAL: o "A" cujo vertice e formado por um cao e um gato de
  perfil, focinhos voltados para fora.

  Ela sai do logo oficial, que e um PNG branco sobre preto chapado sem canal
  alfa - nao da para simplesmente pintar de outra cor. A saida e usar o proprio
  arquivo como MASCARA DE LUMINANCIA: onde ele e branco a mascara deixa passar,
  onde e preto bloqueia. O que passa e um retangulo de cor solida, e ai a cor
  pode ser qualquer uma - inclusive uma que muda com o tema.

  RECORTE. Isolar a marca deu trabalho porque as orelhas se sobrepoem as letras
  vizinhas: nao existe uma unica coluna de pixels vazia entre o "a" de Vida, o
  "A" e o "n" de Animal. Cortar na vertical decepava as focinheiras.
  A solucao foi um corte em L - abaixo da altura-x, so as duas bandas estreitas
  onde vivem "a" (ate x=715) e "n" (a partir de x=1061) sao apagadas. Acima
  dela nada e tocado, porque minuscula sem ascendente nao chega la.

  Resultado: 531x397 no arquivo original, razao 1,34 contra 1,57 do recorte
  ingenuo. Num icone de 16px cada ponto de proporcao vira marca maior.
-->
<style>
  .marca{fill:#000}
  @media (prefers-color-scheme:dark){ .marca{fill:#fff} }
</style>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="24" width="192" height="144">
  <image href="data:image/png;base64," x="0" y="24" width="192" height="144"/>
</mask>
<rect class="marca" width="192" height="192" mask="url(#m)"/>
</svg>
