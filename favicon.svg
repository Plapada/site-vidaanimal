<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    FAVICON DA VIDA ANIMAL — a marca do "A", com o cao e o gato formando o vertice.

    Duas coisas resolvidas aqui:

    1. TROCA DE COR POR TEMA. O `media` em <link rel="icon"> tem suporte irregular
       entre navegadores. Media query DENTRO do SVG e avaliada por Chrome, Firefox
       e Safari, entao a troca acontece no proprio arquivo: preto quando a barra
       do navegador esta clara, branco quando esta escura.

    2. O ARQUIVO DE ORIGEM NAO TEM ALFA. O PNG do logo e branco sobre preto
       chapado. Aqui ele entra como MASCARA de luminancia: o branco da arte vira
       area visivel, o preto vira transparente, e a cor passa a ser pintada por
       um retangulo por baixo. Assim a mesma arte serve aos dois temas sem
       precisar de duas versoes do arquivo.

    A marca foi extraida do PNG e reduzida a 64px por `favicon-builder.html`.
  -->
  <style>
    .marca { fill: #000000 }
    @media (prefers-color-scheme: dark) { .marca { fill: #FFFFFF } }
  </style>
  <mask id="m">
    <image width="64" height="64" href="data:image/png;base64,"/>
  </mask>
  <rect class="marca" width="64" height="64" mask="url(#m)"/>
</svg>
